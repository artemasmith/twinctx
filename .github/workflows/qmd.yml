name: QMD integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/qmd/**'
      - 'context/twinctx/qmd_memory.py'
      - 'context/twinctx/qmd_client.py'
      - 'context/stores/memory_history.py'
      - 'context/twinctx/engine.py'
      - 'context/twinctx/project_search.py'
      - 'context/twinctx/qmd_refresh.py'
      - 'context/twinctx/vault_projects.py'
      - '.github/workflows/qmd.yml'

permissions:
  contents: read

jobs:
  semantic-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TwinCtx and QMD
        run: |
          python -m pip install .
          npm ci --prefix deploy/qmd
      - name: Find a document through the vector index
        env:
          TWINCTX_STORE: sqlite
          TWINCTX_EMBED: none
          TWINCTX_QMD_ENABLED: '1'
        run: |
          set -eu
          export HARNESS_HOME="$RUNNER_TEMP/twinctx"
          export VAULT_DIR="$HARNESS_HOME/vault"
          state="$HARNESS_HOME/qmd"
          mkdir -p "$VAULT_DIR"
          printf '%s\n' '---' 'project: demo' '---' '# Резервирование' 'Резервные копии хранятся сорок пять дней.' > "$VAULT_DIR/archive.md"
          old=$(twinctx remember 'Срок хранения резервных копий базы составляет тридцать дней.' --about retention --valid-from 2026-01-01)
          twinctx remember 'Командировки согласует руководитель отдела до покупки билетов.' --about travel --valid-from 2026-01-01
          twinctx remember 'Нового разработчика нанимаем после технического собеседования.' --about hiring --valid-from 2026-01-01
          python -m twinctx.qmd_refresh "$VAULT_DIR" "$state" deploy/qmd/server.mjs
          node deploy/qmd/server.mjs serve "$state" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 90 --retry-delay 2 --retry-all-errors http://127.0.0.1:26358/health
          # The primary SQLite index is intentionally empty so both calls exercise QMD.
          quote=$(twinctx project-query demo 'Сколько дней хранятся резервные копии?')
          echo "$quote"
          [[ "$quote" == *'сорок пять дней'* && "$quote" == *'vault/archive.md'* ]]
          source=$(twinctx project-query demo 'Когда удаляют бэкапы?')
          echo "$source"
          [[ "$source" == *'vault/archive.md'* ]]
          # Correct the rule after index publication. The only vector in memory is still the old decision.
          new=$(twinctx remember 'Новый норматив: сорок пять суток.' --about retention --valid-from 2026-02-01 --supersedes "$old")
          export OLD_ID="$old" NEW_ID="$new"
          python - <<'PYTHON'
          import json, os, subprocess
          query = "Когда пора удалять бэкапы?"
          from twinctx.qmd_client import hits
          for probe in (query, "Сколько времени держать бэкап?", "Как получить визу на Марс?", "Какова масса Сатурна?"):
              scores = hits("/memory", {"q": probe}, 6)
              print(probe, [(h["id"] == os.environ["OLD_ID"], round(h["score"], 3)) for h in scores], flush=True)
          for at, expected in [("2026-01-15", os.environ["OLD_ID"]), ("2026-03-01", os.environ["NEW_ID"])]:
              result = json.loads(subprocess.check_output(["twinctx", "query", query, "--json", "--corpus", "memory", "--as-of", at]))
              items = result["manifest"]["items"]
              assert [(i["id"], i["via"]) for i in items] == [(expected, "qmd_memory")], result
              assert items[0]["matched_memory_id"] == os.environ["OLD_ID"]
              print(at, result["packed"], items[0]["qmd_similarity"])
          PYTHON
